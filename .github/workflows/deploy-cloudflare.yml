name: Verify and deploy to Cloudflare Pages

# 取代原本的 deploy-pages.yml:那支從 2026-05-01 起每次 push 都失敗,
# 因為這個 repo 的 GitHub Pages 從來沒啟用過。正式站是 Cloudflare Pages
# (https://5-chess.pages.dev),而 CF 專案是 direct upload、不連 Git,
# 所以要由這支 workflow 用 wrangler 推上去。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    # secrets context 在 step 層的 if 不可用,必須先映射到 job 的 env 才能判斷「有沒有設」。
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 不需要 npm install:這個專案零相依,測試只用 Node 內建能力
      - name: Verify
        run: npm run verify

      - name: Stage deploy dir
        run: npm run stage

      # ⚠ 沒設好 secrets 之前這一步會被跳過,CI 仍是綠的(只跑驗證)。
      #   要啟用自動部署,到 repo 的 Settings → Secrets and variables → Actions 新增:
      #     CLOUDFLARE_API_TOKEN   權限選 Account → Cloudflare Pages → Edit
      #     CLOUDFLARE_ACCOUNT_ID  Cloudflare 儀表板網址裡那串 32 位十六進位
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CF_API_TOKEN != '' && env.CF_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .deploy --project-name=5-chess --branch=main --commit-dirty=true

      - name: Deploy skipped (no secrets)
        if: ${{ env.CF_API_TOKEN == '' || env.CF_ACCOUNT_ID == '' }}
        run: |
          echo "::notice::尚未設定 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，已跳過部署。"
          echo "::notice::目前仍需在本機手動執行 npm run deploy。"
